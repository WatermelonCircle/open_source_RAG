[project]
name = "rag-webapp"
version = "0.1.0"
description = "FastAPI RAG webapp with PDF upload and chat functionality"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "openai>=1.12.0",
    "anthropic>=0.7.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.4.0",
    "httpx>=0.25.0",
    "pypdf>=6.0.0",
    "pillow>=11.3.0",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.13",
    "supabase>=2.18.1",
    "psycopg2-binary>=2.9.10",
]

[dependency-groups]
dev = [
    "reportlab>=4.4.3",
]
